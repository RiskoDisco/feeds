name: Update feeds

on:
  schedule:
    - cron: "1 * * * *"    # every hour at minute 01
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python build_feeds.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No new articles"
          else
            git commit -m "Update feeds"
            git push
          fi
